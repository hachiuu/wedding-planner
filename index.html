<script>
const safeFetch=(u,o={})=>{o=Object.assign({},o);if(o.headers&&typeof o.headers.entries==='function'&&!Array.isArray(o.headers))o.headers=Object.fromEntries(o.headers.entries());return fetch(String(u&&u.url?u.url:u),o)};
const sb=supabase.createClient('https://oausdbwevmmazlagomkx.supabase.co','sb_publishable_YFy4TdW56ipZXlqRgoIU2A_6aXiwFp2',{global:{fetch:safeFetch}});
// cols: [index di data, label, tipe] tipe: t=teks, n=angka, c=centang
const S={
 budget:{n:'Wedding Budget',cols:[[0,'Kategori'],[1,'Detail'],[2,'Status','s'],[3,'Vendor'],[5,'Harga','n'],[6,'DP / Bayar','n'],[7,'Sisa','r'],[8,'Tgl bayar','d']]},
 tasks:{n:'To Do List',cols:[[0,'Kategori'],[1,'Tugas'],[2,'Status','s'],[3,'Selesai','c'],[4,'PJ'],[5,'Vendor'],[6,'Kontak'],[8,'Batas waktu','d']]},
 guests:{n:'Daftar Tamu',cols:[[0,'Kategori','s'],[1,'Nama'],[2,'Jenis kelamin','s'],[3,'Prioritas','s'],[4,'Undangan','s'],[5,'Konfirmasi','s']]},
 gifts:{n:'Seserahan',cols:[[0,'No'],[1,'Kategori'],[2,'Barang'],[3,'Brand'],[4,'Centang','c'],[6,'Link','l'],[7,'Harga anggaran','n'],[8,'Harga beli','n']]},
 songs:{n:'Playlist',cols:[[0,'No'],[1,'Judul lagu'],[2,'Keterangan']]},
 vendors:{n:'Vendors',cols:[[0,'Vendor'],[1,'Jasa'],[2,'Status','s'],[3,'Kontak'],[4,'Catatan']]},
 itinerary:{n:'Itinerary',cols:[[0,'Waktu'],[1,'Acara'],[2,'Lokasi'],[3,'PJ'],[4,'Catatan']]}
};
let R={},page='dashboard';
// Lebar kolom (px) per menu, urutannya sama dengan urutan kolom di atas. Mau melebarkan/menyempitkan kolom? Ubah angkanya.
const W={budget:[130,220,105,120,95,95,95,100],tasks:[125,220,105,55,90,110,110,100],guests:[110,220,110,150,110],gifts:[45,120,170,130,60,170,100,100],songs:[45,380,380]};
const SMALL={'tasks:4':1};
W.guests=[110,200,100,150,100,110];W.vendors=[170,160,110,140,260];W.itinerary=[110,220,180,110,260];
const IC={dashboard:'⌂',budget:'▤',tasks:'☑',guests:'♧',gifts:'◇',songs:'♫',vendors:'▣',itinerary:'◷',import:'⇪'};
function grow(e){e.style.height='auto';e.style.height=e.scrollHeight+'px'}
window.addEventListener('resize',()=>document.querySelectorAll('textarea').forEach(grow));
// Pilihan dropdown Status per menu. Mau ganti pilihan? Edit tulisan di dalam kurung siku ini.
const OPT={tasks:['Undecided','Unprocessed','On Progress','Done'],budget:['Belum Bayar','DP','Lunas'],
 'guests:0':['Tamu Cita','Tamu Kasyif'],'guests:2':['Laki-laki','Perempuan'],'guests:3':['VIP (Keluarga)','VIP (Non Keluarga)','Biasa'],'guests:4':['Digital','Fisik','Lisan/Chat'],'guests:5':['Belum','Hadir','Tidak hadir'],'vendors:2':['Survey','Meeting','Booked']};
const rp=n=>'Rp '+new Intl.NumberFormat('id-ID').format(n||0);
const num=v=>Number(v)||0;
const fmtN=v=>(v===null||v===undefined||v==='')?'':Number(v).toLocaleString('en-US');
const liveN=s=>{const d=String(s).replace(/[^\d]/g,'');return d?Number(d).toLocaleString('en-US'):''};
// Tanggal: ketik "10 12 2026", "10/12/26", "10 dec", "10 des 2026", atau "10122026" -> jadi "10 Dec 2026"
const M3={jan:1,feb:2,mar:3,apr:4,may:5,mei:5,jun:6,jul:7,aug:8,agu:8,agt:8,sep:9,oct:10,okt:10,nov:11,dec:12,des:12};
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function parseD(s){
 s=String(s).trim().toLowerCase();if(!s)return '';
 let d,m,y,t=s.match(/^(\d{1,2})[\s\/.\-]*([a-z]{3,})[\s\/.\-,]*(\d{2,4})?$/);
 if(t){d=+t[1];m=M3[t[2].slice(0,3)];y=t[3]}
 else{const n=s.match(/^(\d{1,2})[\s\/.\-]+(\d{1,2})(?:[\s\/.\-]+(\d{2,4}))?$/)||s.match(/^(\d{2})(\d{2})(\d{4}|\d{2})?$/);
  if(n){d=+n[1];m=+n[2];y=n[3]}}
 if(!d||!m||d>31||m>12)return null;
 y=y?(y.length===2?2000+ +y:+y):new Date().getFullYear();
 if(new Date(y,m-1,d).getMonth()!==m-1)return null;
 return String(d).padStart(2,'0')+' '+MN[m-1]+' '+y;
}
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
function toast(m){const e=document.getElementById('msg');e.textContent=m;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,1800)}
async function load(){
 const {data,error}=await sb.from('planner_rows').select('*').order('pos');
 if(error){document.getElementById('c').innerHTML='<div class="card">Gagal terhubung ke Supabase: '+esc(error.message)+'<br>Pastikan langkah SQL sudah dijalankan.</div>';return}
 R={};Object.keys(S).forEach(k=>R[k]=[]);data.forEach(r=>(R[r.sheet]=R[r.sheet]||[]).push(r));
 const mp=v=>{const u=String(v).toUpperCase();return u.includes('DITENTUKAN')?'Undecided':u.includes('BELUM')?'Unprocessed':(u.includes('PROSES')||u.includes('SEDANG'))?'On Progress':u.includes('SELESAI')?'Done':null};
 for(const r of R.tasks){const v=r.cells[2];if(v&&!OPT.tasks.includes(v)){const n=mp(v);if(n){r.cells[2]=n;sb.from('planner_rows').update({cells:r.cells}).eq('id',r.id).then(()=>{})}}}
 const mb=v=>{const u=String(v).toUpperCase();return u.includes('LUNAS')?'Lunas':u.includes('SUDAH')?'DP':u.includes('BELUM')?'Belum Bayar':null};
 for(const r of R.budget){const v=r.cells[2];if(v&&!OPT.budget.includes(v)){const n=mb(v);if(n){r.cells[2]=n;sb.from('planner_rows').update({cells:r.cells}).eq('id',r.id).then(()=>{})}}}
 const U=v=>String(v).toUpperCase();
 const mg={0:v=>U(v).includes('CPW')?'Tamu Cita':U(v).includes('CPP')?'Tamu Kasyif':null,2:v=>U(v).includes('PEREMPUAN')?'Perempuan':U(v).includes('LAKI')?'Laki-laki':null,3:v=>U(v)==='TINGGI'?'VIP (Non Keluarga)':(U(v)==='SEDANG'||U(v)==='RENDAH')?'Biasa':null,4:v=>U(v).includes('DIGITAL')?'Digital':U(v).includes('FISIK')?'Fisik':(U(v).includes('LISAN')||U(v).includes('CHAT'))?'Lisan/Chat':null};
 for(const r of R.guests){let ch=false;for(const i in mg){const v=r.cells[i];if(v&&!OPT['guests:'+i].includes(v)){const n=mg[i](v);if(n){r.cells[i]=n;ch=true}}}if(ch)sb.from('planner_rows').update({cells:r.cells}).eq('id',r.id).then(()=>{})}
 render();
}
function render(){
 const nav=document.getElementById('nav');
 nav.innerHTML=[['dashboard','Dashboard'],...Object.keys(S).map(k=>[k,S[k].n]),['import','Import data']].map(([k,n])=>`<button class="${k===page?'on':''}" onclick="page='${k}';render()">${n}</button>`).join('');
 const T=document.getElementById('t'),D=document.getElementById('d'),C=document.getElementById('c');T.className='';
 if(page==='dashboard'){dash(T,D,C);return}
 if(false){T.textContent='Dashboard';D.textContent='Ringkasan persiapan.';
  const b=R.budget||[],tk=R.tasks||[];const tot=b.reduce((a,r)=>a+num(r.cells[5]),0),pd=b.reduce((a,r)=>a+num(r.cells[6]),0);
  const items=tk.filter(r=>r.cells[1]);const dn=items.filter(r=>r.cells[3]===true).length;
  C.innerHTML=`<div class="cards"><div class="card">Total anggaran<b>${rp(tot)}</b></div><div class="card">Sudah dibayar<b>${rp(pd)}</b></div><div class="card">Tugas selesai<b>${dn} / ${items.length}</b></div></div>`;return}
 if(page==='import'){T.textContent='Import data';D.textContent='Dipakai sekali saja untuk memindahkan data awal ke Supabase.';
  C.innerHTML=`<div class="card"><p>1. Buka file <b>index.html lama</b> di GitHub (versi sebelum diganti).<br>2. Cari baris yang diawali <code>const DATA = </code>, copy seluruh baris itu.<br>3. Paste di kotak ini, lalu klik Import.</p><textarea id="imp" placeholder="const DATA = {...};"></textarea><p><button class="btn p" onclick="doImport()">Import ke Supabase</button></p></div>`;return}
 const s=S[page];T.textContent=s.n;D.textContent='Klik isian mana saja untuk mengedit. Tersimpan otomatis.';
 let rows=R[page]||[];const sc=SORT[page]?s.cols.find(c=>c[0]===SORT[page].i):null;if(sc)rows=sortRows(rows,sc);
 C.innerHTML=`<div class="bar"><input class="search" id="q" placeholder="Cari…" oninput="filt()"><button class="btn p" onclick="addRow()">+ Tambah baris</button>${SORT[page]?'<button class="btn" onclick="sortBy(null)">Kembali ke urutan manual</button>':''}</div>
 <div class="wrap"><table style="min-width:${W[page].reduce((a,b)=>a+b,58)}px"><colgroup>${W[page].map(x=>`<col style="width:${x}px">`).join('')}<col style="width:58px"></colgroup><thead><tr>${s.cols.map(c=>`<th class="${c[2]==='n'||c[2]==='r'?'r':''} sortable" onclick="sortBy(${c[0]})" title="Klik untuk mengurutkan A-Z / Z-A">${c[1]}${SORT[page]&&SORT[page].i===c[0]?(SORT[page].d>0?' ▲':' ▼'):''}</th>`).join('')}<th></th></tr></thead><tbody>${rows.map(r=>`<tr data-id="${r.id}">${s.cols.map(([i,,t])=>{const v=r.cells[i];
  if(t==='c')return `<td><input type="checkbox" ${v===true?'checked':''} onchange="edit(${r.id},${i},this.checked)"></td>`;
  if(t==='r'){const a=r.cells[5],b=r.cells[6];return `<td><input type="text" class="num ro" readonly value="${(a==null&&b==null)?'':fmtN(num(a)-num(b))}"></td>`}
  const O=OPT[page+':'+i]||OPT[page];if(t==='s'&&O)return `<td><select class="sel" onchange="edit(${r.id},${i},this.value,'t')"><option value="">—</option>${v&&!O.includes(v)?`<option selected>${esc(v)}</option>`:''}${O.map(o=>`<option ${v===o?'selected':''}>${o}</option>`).join('')}</select></td>`;
  if(!t||t==='t')return `<td><textarea rows="1" class="${SMALL[page+':'+i]?'sm':''}" onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}" oninput="grow(this)" onchange="edit(${r.id},${i},this.value,'t')">${esc(v)}</textarea></td>`;
  return `<td><input type="text" class="${t==='n'?'num':(t==='d'||t==='l')?'sm':''}" value="${esc(t==='n'?fmtN(v):v)}" ${t==='n'?'inputmode="numeric" oninput="this.value=liveN(this.value)"':''} ${t==='d'?'placeholder="10 Dec 2026"':''} onchange="edit(${r.id},${i},this.value,'${t||'t'}')"></td>`}).join('')}<td class="act"><span class="dh" ${SORT[page]?'data-off="1"':`onpointerdown="pStart(event,${r.id})" onpointermove="pMove(event)" onpointerup="pEnd(event)" onpointercancel="pEnd(event,1)" oncontextmenu="return false"`} title="${SORT[page]?'Kembali ke urutan manual dulu untuk menggeser':'Tahan dan geser untuk mengubah urutan'}">⠿</span><button class="x" onclick="del(${r.id})">✕</button></td></tr>`).join('')}</tbody></table></div>`;
 document.querySelectorAll('textarea').forEach(grow);
}
const SORT={};let DRAG=null;
function sortBy(i){const s=SORT[page];if(i===null||(s&&s.i===i&&s.d===-1))delete SORT[page];else SORT[page]=(s&&s.i===i)?{i,d:-1}:{i,d:1};render()}
function sortRows(rows,col){
 const i=col[0],t=col[2],d=SORT[page].d;
 const val=r=>{const c=r.cells;if(t==='r')return(c[5]==null&&c[6]==null)?null:num(c[5])-num(c[6]);if(t==='d'){const x=new Date(String(c[i]||'')+' 00:00');return isNaN(x)?null:+x}if(t==='c')return c[i]===true?1:0;const v=c[i];return(v===null||v===undefined||v==='')?null:v};
 return[...rows].sort((a,b)=>{const x=val(a),y=val(b);if(x===null&&y===null)return 0;if(x===null)return 1;if(y===null)return-1;
  return d*(typeof x==='number'&&typeof y==='number'?x-y:String(x).localeCompare(String(y),'id',{numeric:true,sensitivity:'base'}))})}
function dClear(){document.querySelectorAll('tr.dov-t,tr.dov-b,tr.dragging').forEach(x=>x.classList.remove('dov-t','dov-b','dragging'))}
function dStart(e,id){DRAG=id;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(id));const tr=e.target.closest('tr');if(tr){e.dataTransfer.setDragImage(tr,20,20);tr.classList.add('dragging')}}
function dEnd(){DRAG=null;dClear()}
function dOver(e){if(DRAG===null)return;e.preventDefault();const tr=e.currentTarget,r=tr.getBoundingClientRect();dClear();tr.classList.add(e.clientY<r.top+r.height/2?'dov-t':'dov-b')}
async function dDrop(e,tid){
 e.preventDefault();const r0=e.currentTarget.getBoundingClientRect(),after=e.clientY>=r0.top+r0.height/2;dClear();
 const id=DRAG;DRAG=null;if(id===null||id===tid)return;
 const a=R[page],from=a.findIndex(r=>r.id===id),[m]=a.splice(from,1);let to=a.findIndex(r=>r.id===tid);if(after)to++;a.splice(to,0,m);
 const ch=[];a.forEach((r,i)=>{if(r.pos!==i){r.pos=i;ch.push(r)}});render();
 const res=await Promise.all(ch.map(r=>sb.from('planner_rows').update({pos:r.pos}).eq('id',r.id)));
 toast(res.some(x=>x.error)?'Gagal menyimpan urutan':'Urutan tersimpan ✓')}
let PD=null;
function pStart(e,id){if(SORT[page])return;e.preventDefault();const tr=e.currentTarget.closest('tr');PD={id,tr,tid:null,after:false};tr.classList.add('dragging');e.currentTarget.setPointerCapture(e.pointerId)}
function pMove(e){if(!PD)return;
 const el=document.elementFromPoint(e.clientX,e.clientY),tr=el&&el.closest('tr[data-id]');
 dClear();PD.tr.classList.add('dragging');PD.tid=null;
 if(tr&&+tr.dataset.id!==PD.id){const r=tr.getBoundingClientRect();PD.after=e.clientY>=r.top+r.height/2;PD.tid=+tr.dataset.id;tr.classList.add(PD.after?'dov-b':'dov-t')}
 if(e.clientY<90)window.scrollBy(0,-14);else if(e.clientY>window.innerHeight-90)window.scrollBy(0,14)}
function pEnd(e,cancel){if(!PD)return;const {id,tid,after}=PD;PD=null;dClear();if(cancel||tid===null)return;moveRow(id,tid,after)}
async function moveRow(id,tid,after){
 const a=R[page],from=a.findIndex(r=>r.id===id),[m]=a.splice(from,1);let to=a.findIndex(r=>r.id===tid);if(after)to++;a.splice(to,0,m);
 const ch=[];a.forEach((r,i)=>{if(r.pos!==i){r.pos=i;ch.push(r)}});render();
 const res=await Promise.all(ch.map(r=>sb.from('planner_rows').update({pos:r.pos}).eq('id',r.id)));
 toast(res.some(x=>x.error)?'Gagal menyimpan urutan':'Urutan tersimpan ✓')}
function go(p,a){page=p;render();if(a)addRow()}
async function tog(id){const r=R.tasks.find(x=>x.id===id);r.cells[3]=r.cells[3]!==true;await sb.from('planner_rows').update({cells:r.cells}).eq('id',id);render()}
async function saveMeta(i,v){let m=(R.meta||[])[0];
 if(!m){const {data,error}=await sb.from('planner_rows').insert({sheet:'meta',pos:0,cells:Array(9).fill(null)}).select().single();if(error)return toast('Gagal: '+error.message);m=data;R.meta=[m]}
 m.cells[i]=v||null;const {error}=await sb.from('planner_rows').update({cells:m.cells}).eq('id',m.id);toast(error?'Gagal simpan':'Tersimpan ✓')}
function setWd(e){const p=parseD(e.value);if(p===null){toast('Tanggal tidak dikenali. Contoh: 10 12 2027');return}e.value=p;saveMeta(0,p).then(tick)}
function tick(){const m=(R.meta||[])[0],s=m&&m.cells[0],d=s?new Date(s+' 00:00'):null,e=[0,1,2,3].map(i=>document.getElementById('cd'+i));
 if(!e[0])return;if(!d||isNaN(d)){e.forEach(x=>x.textContent='–');return}
 const t=Math.max(0,d-new Date()),v=[Math.floor(t/864e5),Math.floor(t/36e5)%24,Math.floor(t/6e4)%60,Math.floor(t/1e3)%60];e.forEach((x,i)=>x.textContent=v[i])}
function dash(T,D,C){
 T.textContent='';D.textContent='';
 const b=R.budget||[],tk=(R.tasks||[]).filter(r=>r.cells[1]),gs=(R.guests||[]).filter(r=>r.cells[1]),vs=(R.vendors||[]).filter(r=>r.cells[0]),mt=(R.meta||[])[0];
 const tot=b.reduce((a,r)=>a+num(r.cells[5]),0),pd=b.reduce((a,r)=>a+num(r.cells[6]),0),dn=tk.filter(r=>r.cells[3]===true).length;
 const pc=(a,t)=>t?Math.round(a/t*100):0,bk=vs.filter(r=>r.cells[2]==='Booked').length,cf=gs.filter(r=>r.cells[5]==='Hadir').length;
 let last='',cat={};b.forEach(r=>{last=r.cells[0]||last;const v=num(r.cells[5]);if(v){const k=last||'Lainnya';cat[k]=(cat[k]||0)+v}});
 const CL=['#8fa98a','#e8a6a6','#9fcbe0','#f0d29a','#c4b3e6','#f2b5c8'];
 let ce=Object.entries(cat).sort((x,y)=>y[1]-x[1]);if(ce.length>6){const o=ce.slice(5).reduce((a,x)=>a+x[1],0);ce=ce.slice(0,5);ce.push(['Lainnya',o])}
 let acc=0;const seg=ce.map(([k,v],i)=>{const s=acc;acc+=v/tot*100;return CL[i]+' '+s+'% '+acc+'%'}).join(',');
 const dt=s=>{const d=new Date(String(s||'')+' 00:00');return isNaN(d)?9e15:+d};
 const up=tk.filter(r=>r.cells[3]!==true).sort((x,y)=>dt(x.cells[8])-dt(y.cells[8])).slice(0,5);
 C.innerHTML=`<div class="topbar"><div class="cdbox"><div><small>Our Wedding Day</small><input class="wd" placeholder="Atur tanggal nikah" value="${esc(mt&&mt.cells[0])}" onchange="setWd(this)"></div><div class="cd"><span id="cd0">–</span><i>Days</i></div><div class="cd"><span id="cd1">–</span><i>Hours</i></div><div class="cd"><span id="cd2">–</span><i>Mins</i></div><div class="cd"><span id="cd3">–</span><i>Secs</i></div></div></div>
 <div class="hero"><div><div class="hello">Welcome back,</div><div class="big">Kasyif <span>&amp;</span> Cita</div><div class="tag">A little progress today, for a beautiful tomorrow.</div></div><div class="card quote"><p>“Good planning makes more room for the moments that truly matter.”</p></div></div>
 <div class="stats"><div class="card s1" onclick="go('budget')"><small>Total Budget</small><b>${rp(tot)}</b><div class="pbar"><i style="width:${pc(pd,tot)}%"></i></div><small>${rp(pd)} dibayar · ${pc(pd,tot)}%</small></div>
 <div class="card s2" onclick="go('tasks')"><small>Checklist</small><b>${dn} / ${tk.length}</b><div class="pbar"><i style="width:${pc(dn,tk.length)}%"></i></div><small>${pc(dn,tk.length)}% selesai</small></div>
 <div class="card s3" onclick="go('guests')"><small>Guest List</small><b>${gs.length} tamu</b><small>${cf} hadir</small></div>
 <div class="card s4" onclick="go('vendors')"><small>Vendors</small><b>${bk} booked</b><small>${vs.length-bk} pending</small></div></div>
 <div class="dgrid"><div class="card"><h3>Upcoming Tasks</h3>${up.length?up.map(r=>`<div class="task"><span class="circ" onclick="tog(${r.id})"></span><span>${esc(r.cells[1])}</span><em>${esc(r.cells[8])}</em></div>`).join(''):'<p class="muted">Semua tugas selesai.</p>'}</div>
 <div class="card"><h3>Budget Overview</h3>${tot?`<div class="dn"><div class="donut" style="background:conic-gradient(${seg})"><div>${rp(tot)}<small>Total Budget</small></div></div><div class="leg">${ce.map(([k,v],i)=>`<div><i style="background:${CL[i]}"></i><span>${esc(k)}</span><em>${rp(v)}</em><u>${pc(v,tot)}%</u></div>`).join('')}</div></div>`:'<p class="muted">Isi kolom Harga di menu Wedding Budget untuk melihat grafiknya.</p>'}</div></div>
 <div class="dgrid"><div class="card"><h3>Quick Access</h3><div class="qa"><button class="q1" onclick="go('tasks',1)">+ Add Task</button><button class="q2" onclick="go('budget',1)">+ Add Expense</button><button class="q3" onclick="go('guests',1)">+ Add Guest</button><button class="q4" onclick="go('vendors',1)">+ Add Vendor</button></div></div>
 <div class="card"><h3>Notes</h3><textarea class="note" placeholder="Write a quick note…" onchange="saveMeta(1,this.value)">${esc(mt&&mt.cells[1])}</textarea></div></div>`;
 clearInterval(window._cd);window._cd=setInterval(tick,1000);tick();
}
function filt(){const q=document.getElementById('q').value.toLowerCase();document.querySelectorAll('tbody tr').forEach(tr=>{tr.style.display=[...tr.querySelectorAll('input[type=text],textarea')].map(i=>i.value).join(' ').toLowerCase().includes(q)?'':'none'})}
async function edit(id,i,v,t){
 const r=R[page].find(x=>x.id===id);
 if(t==='n'){v=String(v).replace(/[^\d.-]/g,'');v=v===''?null:Number(v)} else if(t==='d'){const p=parseD(v);if(p===null){toast('Tanggal tidak dikenali. Contoh: 10 12 2026');render();return}v=p||null}
 else if((t==='t'||t==='l')&&v==='')v=null;
 r.cells[i]=v;
 if(page==='budget'&&(i===5||i===6)&&r.cells[5]!=null)r.cells[7]=num(r.cells[5])-num(r.cells[6]);
 const {error}=await sb.from('planner_rows').update({cells:r.cells}).eq('id',id);
 if(error)toast('Gagal simpan: '+error.message);else{toast('Tersimpan ✓');if(page==='budget')render()}
}
async function addRow(){
 const pos=Math.max(0,...R[page].map(r=>r.pos))+1;
 const {data,error}=await sb.from('planner_rows').insert({sheet:page,pos,cells:Array(9).fill(null)}).select().single();
 if(error)return toast('Gagal: '+error.message);R[page].push(data);render();toast('Baris ditambah');
}
async function del(id){
 if(!confirm('Hapus baris ini?'))return;
 const {error}=await sb.from('planner_rows').delete().eq('id',id);
 if(error)return toast('Gagal: '+error.message);R[page]=R[page].filter(r=>r.id!==id);render();
}
async function doImport(){
 let txt=document.getElementById('imp').value.trim();
 try{txt=txt.slice(txt.indexOf('{'),txt.lastIndexOf('}')+1);var D=JSON.parse(txt)}catch(e){return alert('Isinya belum pas. Pastikan yang di-copy seluruh baris "const DATA = {...};"')}
 if(Object.values(R).some(a=>a.length)&&!confirm('Data sudah ada. Import lagi akan menggandakan data. Lanjut?'))return;
 const out=[];
 for(const sh of Object.keys(S)){(D[sh]||[]).forEach((cells,idx)=>{
  if(sh==='songs'&&cells[0]==='No')return;
  if(!cells.some(v=>v!==null&&v!==''&&v!==false))return;
  const c=cells.slice(0,9);while(c.length<9)c.push(null);out.push({sheet:sh,pos:idx,cells:c})})}
 for(let i=0;i<out.length;i+=200){const {error}=await sb.from('planner_rows').insert(out.slice(i,i+200));if(error)return alert('Gagal: '+error.message)}
 toast('Import selesai: '+out.length+' baris');page='dashboard';load();
}
load();
</script></body></html>
